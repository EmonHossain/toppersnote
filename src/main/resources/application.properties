spring.config.import=optional:file:.env[.properties]

spring.application.name=${APP_NAME}
server.port=${SERVER_PORT}

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW}
spring.jpa.show-sql=${JPA_SHOW_SQL}

spring.flyway.enabled=${FLYWAY_ENABLED}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE}
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.quartz.job-store-type=memory
spring.quartz.auto-startup=${QUARTZ_AUTO_STARTUP}
lifecycle.exam-reminder-cron=${EXAM_REMINDER_CRON}
lifecycle.exam-reminder-days-before=${EXAM_REMINDER_DAYS_BEFORE}

retention.notes.retention-years=${NOTE_RETENTION_YEARS}
retention.notes.notice-lead-days=${NOTE_RETENTION_NOTICE_LEAD_DAYS}
retention.notes.batch-size=${NOTE_RETENTION_BATCH_SIZE}
retention.notes.auto-delete-enabled=${NOTE_RETENTION_AUTO_DELETE_ENABLED}
retention.notes.scan-cron=${NOTE_RETENTION_SCAN_CRON}
retention.notes.notice-cron=${NOTE_RETENTION_NOTICE_CRON}
retention.notes.removal-cron=${NOTE_RETENTION_REMOVAL_CRON}
retention.notes.note-link-base-url=${NOTE_RETENTION_NOTE_LINK_BASE_URL:${API_BASE_PATH}}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED}

spring.cache.type=${CACHE_TYPE}

#Redis properties

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:admin}
spring.data.redis.timeout=${REDIS_TIMEOUT:3000ms}


spring.elasticsearch.uris=${ELASTICSEARCH_URIS}
spring.elasticsearch.username=${ELASTICSEARCH_USERNAME:}
spring.elasticsearch.password=${ELASTICSEARCH_PASSWORD:}
spring.elasticsearch.connection-timeout=${ELASTICSEARCH_CONNECTION_TIMEOUT}
spring.elasticsearch.socket-timeout=${ELASTICSEARCH_SOCKET_TIMEOUT}
search.notes.index-name=${NOTE_SEARCH_INDEX_NAME}
search.notes.default-limit=${NOTE_SEARCH_DEFAULT_LIMIT}
search.notes.max-limit=${NOTE_SEARCH_MAX_LIMIT}
resilience.search.failure-rate-threshold=${SEARCH_RESILIENCE_FAILURE_RATE_THRESHOLD}
resilience.search.sliding-window-size=${SEARCH_RESILIENCE_SLIDING_WINDOW_SIZE}
resilience.search.minimum-number-of-calls=${SEARCH_RESILIENCE_MINIMUM_CALLS}
resilience.search.open-state-duration=${SEARCH_RESILIENCE_OPEN_STATE_DURATION}
resilience.search.retry-max-attempts=${SEARCH_RESILIENCE_RETRY_MAX_ATTEMPTS}
resilience.search.retry-wait-duration=${SEARCH_RESILIENCE_RETRY_WAIT_DURATION}

management.endpoints.web.exposure.include=${ACTUATOR_EXPOSED_ENDPOINTS}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${ACTUATOR_HEALTH_SHOW_DETAILS}
management.health.redis.enabled=${REDIS_HEALTH_ENABLED}
management.health.elasticsearch.enabled=${ELASTICSEARCH_HEALTH_ENABLED}
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=${PROMETHEUS_METRICS_ENABLED}
management.otlp.metrics.export.enabled=${OTLP_METRICS_ENABLED}
management.otlp.metrics.export.url=${OTLP_METRICS_URL}
management.otlp.metrics.export.step=${OTLP_METRICS_STEP}
management.tracing.enabled=${OTEL_TRACING_ENABLED}
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLING_PROBABILITY}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}

springdoc.api-docs.enabled=${OPENAPI_DOCS_ENABLED}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

api.version.base-path=${API_BASE_PATH}

analytics.default-window-days=${ANALYTICS_DEFAULT_WINDOW_DAYS}
analytics.max-window-days=${ANALYTICS_MAX_WINDOW_DAYS}
analytics.max-result-limit=${ANALYTICS_MAX_RESULT_LIMIT}
analytics.tracking-enabled=${ANALYTICS_TRACKING_ENABLED}

study-groups.activity.default-limit=${STUDY_GROUP_ACTIVITY_DEFAULT_LIMIT}
study-groups.activity.max-limit=${STUDY_GROUP_ACTIVITY_MAX_LIMIT}

dashboard.max-classes=${DASHBOARD_MAX_CLASSES}
dashboard.max-upcoming-exams=${DASHBOARD_MAX_UPCOMING_EXAMS}
dashboard.max-recommended-notes=${DASHBOARD_MAX_RECOMMENDED_NOTES}
dashboard.recommendation-candidate-limit=${DASHBOARD_RECOMMENDATION_CANDIDATE_LIMIT}
dashboard.max-recent-notifications=${DASHBOARD_MAX_RECENT_NOTIFICATIONS}
dashboard.max-unread-suggestions=${DASHBOARD_MAX_UNREAD_SUGGESTIONS}
dashboard.max-active-study-groups=${DASHBOARD_MAX_ACTIVE_STUDY_GROUPS}
dashboard.analytics-window-days=${DASHBOARD_ANALYTICS_WINDOW_DAYS}

quality.notes.analytics-window-days=${NOTE_QUALITY_ANALYTICS_WINDOW_DAYS}
quality.notes.max-result-limit=${NOTE_QUALITY_MAX_RESULT_LIMIT}
quality.notes.recalculation-max-age-minutes=${NOTE_QUALITY_RECALCULATION_MAX_AGE_MINUTES}
quality.notes.upvote-weight=${NOTE_QUALITY_UPVOTE_WEIGHT}
quality.notes.download-weight=${NOTE_QUALITY_DOWNLOAD_WEIGHT}
quality.notes.view-weight=${NOTE_QUALITY_VIEW_WEIGHT}
quality.notes.preview-weight=${NOTE_QUALITY_PREVIEW_WEIGHT}
quality.notes.version-weight=${NOTE_QUALITY_VERSION_WEIGHT}
quality.notes.freshness-weight=${NOTE_QUALITY_FRESHNESS_WEIGHT}
quality.notes.max-freshness-days=${NOTE_QUALITY_MAX_FRESHNESS_DAYS}
quality.notes.active-report-penalty=${NOTE_QUALITY_ACTIVE_REPORT_PENALTY}

security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
security.jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE}

storage.notes.directory=${NOTE_STORAGE_DIRECTORY}
storage.notes.max-file-size-bytes=${NOTE_MAX_FILE_SIZE_BYTES}
storage.notes.type=${NOTE_STORAGE_TYPE}
storage.notes.s3-bucket=${NOTE_STORAGE_S3_BUCKET}
storage.notes.s3-prefix=${NOTE_STORAGE_S3_PREFIX}
storage.notes.s3-region=${NOTE_STORAGE_S3_REGION}
storage.notes.s3-endpoint=${NOTE_STORAGE_S3_ENDPOINT:}
storage.notes.s3-path-style-access=${NOTE_STORAGE_S3_PATH_STYLE_ACCESS}
storage.notes.s3-access-key=${NOTE_STORAGE_S3_ACCESS_KEY:}
storage.notes.s3-secret-key=${NOTE_STORAGE_S3_SECRET_KEY:}

storage.profile-pictures.directory=${PROFILE_PICTURE_STORAGE_DIRECTORY}
storage.profile-pictures.max-file-size-bytes=${PROFILE_PICTURE_MAX_FILE_SIZE_BYTES}
storage.profile-pictures.type=${PROFILE_PICTURE_STORAGE_TYPE}
storage.profile-pictures.s3-bucket=${PROFILE_PICTURE_STORAGE_S3_BUCKET}
storage.profile-pictures.s3-prefix=${PROFILE_PICTURE_STORAGE_S3_PREFIX}
storage.profile-pictures.s3-region=${PROFILE_PICTURE_STORAGE_S3_REGION}
storage.profile-pictures.s3-endpoint=${PROFILE_PICTURE_STORAGE_S3_ENDPOINT:}
storage.profile-pictures.s3-path-style-access=${PROFILE_PICTURE_STORAGE_S3_PATH_STYLE_ACCESS}
storage.profile-pictures.s3-access-key=${PROFILE_PICTURE_STORAGE_S3_ACCESS_KEY:}
storage.profile-pictures.s3-secret-key=${PROFILE_PICTURE_STORAGE_S3_SECRET_KEY:}

email.verification.token-expiration-minutes=${EMAIL_VERIFICATION_TOKEN_EXPIRATION_MINUTES}
email.verification.base-url=${EMAIL_VERIFICATION_BASE_URL:http://localhost:4200}
email.verification.api-base-path=${API_BASE_PATH}
email.verification.allowed-domains=${EMAIL_VERIFICATION_ALLOWED_DOMAINS:}
email.verification.delivery=${EMAIL_VERIFICATION_DELIVERY}
email.verification.from-address=${EMAIL_VERIFICATION_FROM_ADDRESS}
email.verification.subject=${EMAIL_VERIFICATION_SUBJECT:Verify your ShareNote email}
email.verification.kafka.topic=${EMAIL_VERIFICATION_KAFKA_TOPIC:sharenote.email-verification}
email.verification.kafka.dead-letter-topic=${EMAIL_VERIFICATION_KAFKA_DLT:sharenote.email-verification.dlt}
email.verification.kafka.consumer-group=${EMAIL_VERIFICATION_KAFKA_CONSUMER_GROUP:sharenote-email-verification}
email.verification.kafka.partitions=${EMAIL_VERIFICATION_KAFKA_PARTITIONS:3}
email.verification.kafka.replication-factor=${EMAIL_VERIFICATION_KAFKA_REPLICATION_FACTOR:1}
email.verification.kafka.retention-ms=${EMAIL_VERIFICATION_KAFKA_RETENTION_MS:86400000}
email.verification.kafka.retry-attempts=${EMAIL_VERIFICATION_KAFKA_RETRY_ATTEMPTS:3}
email.verification.kafka.retry-backoff-ms=${EMAIL_VERIFICATION_KAFKA_RETRY_BACKOFF_MS:1000}

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:5000}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.client-id=${KAFKA_CLIENT_ID:sharenote-api}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:30000}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:10000}
spring.kafka.consumer.group-id=${EMAIL_VERIFICATION_KAFKA_CONSUMER_GROUP:sharenote-email-verification}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.sharenote.verification.messaging
spring.kafka.consumer.properties.spring.json.value.default.type=com.sharenote.verification.messaging.EmailVerificationMessage
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false

ai.max-prompt-chars=${AI_MAX_PROMPT_CHARS}
ai.max-attachment-bytes=${AI_MAX_ATTACHMENT_BYTES}
ai.request-timeout-seconds=${AI_REQUEST_TIMEOUT_SECONDS}
ai.openai-base-url=${AI_OPENAI_BASE_URL}
ai.anthropic-base-url=${AI_ANTHROPIC_BASE_URL}
ai.google-gemini-base-url=${AI_GOOGLE_GEMINI_BASE_URL}
ai.xai-base-url=${AI_XAI_BASE_URL}

# Logging context keys
logging.properties.trace-id-key=${TRACE_ID_KEY}
logging.properties.tenant-id-key=${TENANT_ID_KEY}
logging.properties.user-id-key=${USER_ID_KEY}
logging.properties.client-ip-key=${CLIENT_IP_KEY}

# Set root logging level to INFO by default and allow environment overrides.
logging.level.root=${LOGGING_LEVEL_ROOT}
# Write ECS JSON logs to a file that Filebeat can ship into Elasticsearch.
logging.file.name=${LOG_FILE}
logging.structured.format.file=${LOGGING_STRUCTURED_FILE_FORMAT}
logging.structured.format.console=${LOGGING_STRUCTURED_CONSOLE_FORMAT}

# ROLE
app.user.role.name-prefix = ROLE_
app.user.role.default-name = USER_DEFAULT

#User policy values
user.policy.temporary_ban_escalation_threshold = 3